# Render Blueprint: deploys the site as a free static site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: crealens-3d-real-estate
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # 3D models, textures and hashed JS/CSS never change between deploys: cache them hard
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
